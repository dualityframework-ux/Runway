<style>
/* Layout: one phone column of ledger sheets, bottom tab bar, figures in mono like a bank passbook */
:root{
  --paper:#EEF1F5; --sheet:#FBFCFE; --ink:#172033; --muted:#5C6678; --rule:#D5DBE5;
  --accent:#2D4FA3; --accent-ink:#FBFCFE; --accent-soft:#E1E8F7; --brass:#9C5E00; --brass-soft:#FBEFD9;
  --good:#1F7A4D; --warn:#A86A00; --bad:#B23A2E; --bad-soft:#F6E1DE;
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1320; --sheet:#151C2C; --ink:#E4E9F2; --muted:#95A0B4; --rule:#29324A;
  --accent:#8FA9F0; --accent-ink:#0E1320; --accent-soft:#1E2944; --brass:#E2A443; --brass-soft:#33280F;
  --good:#5CC49B; --warn:#E3A93C; --bad:#F07A6B; --bad-soft:#3A201D; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1320; --sheet:#151C2C; --ink:#E4E9F2; --muted:#95A0B4; --rule:#29324A;
  --accent:#8FA9F0; --accent-ink:#0E1320; --accent-soft:#1E2944; --brass:#E2A443; --brass-soft:#33280F;
  --good:#5CC49B; --warn:#E3A93C; --bad:#F07A6B; --bad-soft:#3A201D; color-scheme:dark}
html,body{background:var(--paper);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 110px;display:flex;flex-direction:column;gap:16px}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand{display:flex;flex-direction:column;gap:2px}
h1{font-family:var(--f-display);font-weight:800;font-size:1.65rem;letter-spacing:-.02em;margin:0}
.tag{font-size:.82rem;color:var(--muted)}
.asof{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
h2{font-family:var(--f-display);font-weight:600;font-size:1.1rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.banner{background:var(--brass-soft);border:1px solid var(--brass);border-radius:10px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner p{font-size:.88rem;min-width:0;flex:1 1 220px}
.banner b{color:var(--brass)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.label{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.hero .big{font-family:var(--f-num);font-size:1.55rem;font-weight:500;letter-spacing:-.02em}
.hero .mid{font-family:var(--f-num);font-size:1.1rem}
.sub{font-size:.82rem;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--bad)} .warn{color:var(--warn)}
.chart{width:100%;height:auto;display:block}
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:3.4rem 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row .d{font-family:var(--f-num);font-size:.78rem;color:var(--muted)}
.row .n{min-width:0}
.row .n small{display:block;color:var(--muted);font-size:.75rem}
.row .a{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.row .a small{display:block;color:var(--muted);font-size:.75rem}
.row.pay .n{font-weight:600;color:var(--accent)}
.pill{display:inline-block;font-size:.7rem;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;letter-spacing:.02em}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.brass{background:transparent;border:1px solid var(--brass);color:var(--brass)}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:9px 14px;cursor:pointer}
button.ghost{background:transparent;color:var(--accent)}
button.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
button.danger.armed{background:var(--bad);color:var(--sheet)}
button.tiny{padding:4px 9px;font-size:.8rem}
button.x{background:transparent;border:0;color:var(--muted);padding:4px 8px;font-size:1.1rem}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:7px;padding:8px 10px;min-width:0;width:100%}
textarea{font-family:var(--f-num);font-size:.78rem;min-height:90px;resize:vertical}
input.num{text-align:right}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.check{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--rule);cursor:pointer}
.check:first-child{border-top:0}
.check input{width:22px;height:22px;accent-color:var(--accent)}
.check.done .n{color:var(--muted);text-decoration:line-through}
.seg{display:flex;gap:6px;align-items:center;justify-content:space-between}
.bar{height:8px;border-radius:4px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar i.over{background:var(--bad)}
.cat{display:flex;flex-direction:column;gap:5px;padding:8px 0;border-top:1px solid var(--rule)}
.cat:first-child{border-top:0}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl th{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:500;text-align:right;padding:6px 4px;border-bottom:1px solid var(--rule)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:9px 4px;border-bottom:1px solid var(--rule);text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.tbl td:first-child{font-family:var(--f-body)}
.tbl tr.focus td{color:var(--accent);font-weight:600}
.scroll{overflow-x:auto}
.editrow{display:grid;gap:8px;padding:10px 0;border-top:1px solid var(--rule)}
.editrow:first-of-type{border-top:0}
.status{font-size:.75rem;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
footer.by{font-size:.75rem;color:var(--muted);text-align:center}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sheet);border-top:1px solid var(--rule);display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));z-index:5}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:600;padding:6px 2px;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:3px;letter-spacing:.02em}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a.on{color:var(--accent);background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:.85rem;z-index:6}
@media (max-width:380px){.hero .big{font-size:1.3rem}.grid3{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>

  <a href="#setup" data-v="setup"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Setup</a>
</nav>

<script>
(function(){
const KEY = "runway.v1";
const VIEWS = ["plan","bills","debt","spend","setup"];
let S = null, canStore = true, saveTimer = null;
let spendMonth = null, billMonth = null, armed = null, armTimer = null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = (n, cents=true) => { const v = Number(n)||0; const s = Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:cents?2:0,maximumFractionDigits:cents?2:0}); return (v<0?"−$":"$")+s; };
const uid = () => Math.random().toString(36).slice(2,9);
const numIn = v => parseFloat(String(v).replace(/[$,]/g,""))||0;

// ---------- dates (local, noon-anchored) ----------
const D = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d, 12); };
const iso = dt => dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
const addDays = (dt, n) => { const x = new Date(dt); x.setDate(x.getDate()+n); return x; };
const mkey = dt => dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0");
const dim = (y,m) => new Date(y, m+1, 0).getDate();
const short = dt => dt.toLocaleDateString("en-US",{month:"short",day:"numeric"});
const monthName = k => { const [y,m]=k.split("-").map(Number); return new Date(y,m-1,1).toLocaleDateString("en-US",{month:"long",year:"numeric"}); };
const shiftMonth = (k, n) => { const [y,m]=k.split("-").map(Number); return mkey(new Date(y, m-1+n, 1)); };
const todayKey = () => mkey(new Date());

function normalize(s){
  s = s || {};
  s.asOf ||= iso(new Date()); s.checking = +s.checking||0; s.savings = +s.savings||0;
  s.floor = s.floor==null?1000:+s.floor; s.extra = +s.extra||0; s.method ||= "avalanche";
  s.pay ||= {amount:0,next:iso(new Date()),everyDays:14,oneOffs:[]}; s.pay.oneOffs ||= [];
  s.bills ||= []; s.budget ||= []; s.debts ||= []; s.paid ||= {}; s.log ||= [];
  s.sample = !!s.sample;
  return s;
}

// Example household, dated relative to today so the projection always looks live
function sampleState(){
  const t = new Date(); t.setHours(12,0,0,0); const k = mkey(t);
  const bills = [
    {id:uid(),name:"Rent",day:1,amount:1450},{id:uid(),name:"Car payment",day:12,amount:340},
    {id:uid(),name:"Phone",day:15,amount:65},{id:uid(),name:"Internet",day:18,amount:70},
    {id:uid(),name:"Car insurance",day:22,amount:120},{id:uid(),name:"Streaming",day:27,amount:25}];
  const paid = {[k]: bills.filter(b=>b.day < t.getDate()).map(b=>b.id)};
  const log = [
    {cat:"Groceries",amount:86.42,d:-2,note:"Weekly shop"},{cat:"Gas",amount:48.10,d:-3,note:""},
    {cat:"Dining out",amount:32.75,d:-5,note:"Pizza night"},{cat:"Groceries",amount:64.18,d:-9,note:""},
    {cat:"Other",amount:22.00,d:-11,note:"Haircut"}]
    .map(e=>({id:uid(),date:iso(addDays(t,e.d)),cat:e.cat,amount:e.amount,note:e.note}))
    .filter(e=>e.date.startsWith(k));
  return normalize({
    sample:true, asOf:iso(t), checking:3200, savings:1500, floor:1000, extra:100, method:"avalanche",
    pay:{amount:1850,next:iso(addDays(t,5)),everyDays:14,oneOffs:[]},
    bills, paid, log,
    budget:[{id:uid(),name:"Groceries",monthly:450},{id:uid(),name:"Gas",monthly:180},{id:uid(),name:"Dining out",monthly:150},{id:uid(),name:"Other",monthly:120}],
    debts:[{id:uid(),name:"Visa",balance:4200,apr:24.99,payment:120,note:""},
           {id:uid(),name:"Store card",balance:900,apr:29.99,payment:40,note:""},
           {id:uid(),name:"Student loan",balance:11800,apr:5.5,payment:150,note:"Fixed rate"}]
  });
}

// ---------- projection ----------
function project(days=62){
  const start = D(S.asOf), end = addDays(start, days);
  const ev = [];
  let cur = new Date(start.getFullYear(), start.getMonth(), 1, 12);
  while (cur <= end){
    const y = cur.getFullYear(), m = cur.getMonth(), k = mkey(cur);
    for (const b of S.bills){
      const dt = new Date(y, m, Math.min(+b.day||1, dim(y,m)), 12);
      if (dt > start && dt <= end && !(S.paid[k]||[]).includes(b.id)) ev.push({date:dt, name:b.name, amt:-(+b.amount||0), kind:"bill"});
    }
    cur = new Date(y, m+1, 1, 12);
  }
  if (+S.pay.amount > 0 && S.pay.next){
    let p = D(S.pay.next); const step = Math.max(1, +S.pay.everyDays||14);
    while (p <= start) p = addDays(p, step);
    while (p <= end){ ev.push({date:p, name:"Paycheck", amt:+S.pay.amount, kind:"pay"}); p = addDays(p, step); }
  }
  for (const o of S.pay.oneOffs){ if(!o.date) continue; const dt = D(o.date); if (dt>start && dt<=end) ev.push({date:dt, name:o.label||"Paycheck", amt:+o.amount||0, kind:"pay"}); }
  ev.sort((a,b)=>a.date-b.date || b.amt-a.amt);
  const daily = S.budget.reduce((t,b)=>t+(+b.monthly||0),0)*12/365;
  const series = []; let bal = S.checking, i = 0, low = {bal:S.checking,date:start}, rows = [];
  series.push({date:start, bal});
  for (let d = 1; d <= days; d++){
    const dt = addDays(start, d);
    bal -= daily;
    while (i < ev.length && iso(ev[i].date) === iso(dt)){ bal += ev[i].amt; rows.push({...ev[i], after:bal}); i++; }
    series.push({date:dt, bal});
    if (bal < low.bal) low = {bal, date:dt};
  }
  const nextPay = ev.find(e=>e.kind==="pay");
  return {rows, series, low, daily, nextPay, end:bal};
}

function lineChart(series, floor){
  const W=520,H=170,L=46,R=10,T=12,B=24;
  const vals = series.map(p=>p.bal).concat([floor]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = (hi-lo)*0.08||500; lo = Math.floor((lo-pad)/1000)*1000; if (Math.min(...vals) >= 0) lo = Math.max(0, lo); hi = Math.ceil((hi+pad)/1000)*1000; if (hi<=lo) hi = lo+1000;
  const x = i => L + (W-L-R)*i/(series.length-1);
  const y = v => T + (H-T-B)*(1-(v-lo)/(hi-lo));
  const step = Math.max(1000, Math.ceil((hi-lo)/4/1000)*1000);
  let grid = ""; for (let v=lo; v<=hi; v+=step){ grid += `<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${Math.abs(v)>=1000?(v/1000)+"k":v}</text>`; }
  const pts = series.map((p,i)=>`${x(i).toFixed(1)},${y(p.bal).toFixed(1)}`).join(" ");
  const base = y(Math.max(lo,0));
  const area = `${L},${base} ${pts} ${x(series.length-1)},${base}`;
  let ticks = ""; series.forEach((p,i)=>{ if (p.date.getDate()===1) ticks += `<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${p.date.toLocaleDateString("en-US",{month:"short"})}</text><line x1="${x(i)}" x2="${x(i)}" y1="${H-B}" y2="${H-B+4}" stroke="var(--muted)"/>`; });
  const li = series.reduce((m,p,i)=>p.bal<series[m].bal?i:m,0);
  const fy = y(floor);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Projected checking balance">
    ${grid}
    <polygon points="${area}" fill="var(--accent)" opacity=".10"/>
    ${floor>lo?`<line x1="${L}" x2="${W-R}" y1="${fy}" y2="${fy}" stroke="var(--brass)" stroke-dasharray="4 4" stroke-width="1.2"/><text x="${W-R}" y="${fy-4}" text-anchor="end" font-size="10" fill="var(--brass)">floor ${money(floor,false)}</text>`:""}
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${x(li)}" cy="${y(series[li].bal)}" r="4" fill="var(--bad)"/>
    <circle cx="${x(series.length-1)}" cy="${y(series[series.length-1].bal)}" r="4" fill="var(--accent)"/>
    ${ticks}
  </svg>`;
}

// ---------- debt simulation ----------
function simulate(extra, method){
  let debts = S.debts.map(d=>({id:d.id,name:d.name,bal:+d.balance||0,apr:+d.apr||0,pay:+d.payment||0,paidOff:null,interest:0}));
  const start = D(S.asOf); let month = 0, totalInt = 0; const curve = [debts.reduce((t,d)=>t+d.bal,0)];
  while (debts.some(d=>d.bal>0.005) && month < 600){
    month++;
    for (const d of debts){ if (d.bal>0){ const i = d.bal*d.apr/100/12; d.bal+=i; d.interest+=i; totalInt+=i; } }
    let pool = extra;
    for (const d of debts){ if (d.bal<=0) { pool += d.pay; continue; } const p = Math.min(d.pay, d.bal); d.bal -= p; pool += d.pay - p; }
    const order = debts.filter(d=>d.bal>0.005).sort(method==="snowball" ? (a,b)=>a.bal-b.bal : (a,b)=>b.apr-a.apr || a.bal-b.bal);
    for (const d of order){ if (pool<=0) break; const p = Math.min(pool, d.bal); d.bal -= p; pool -= p; }
    for (const d of debts){ if (d.bal<=0.005 && d.paidOff===null){ d.bal=0; d.paidOff=month; } }
    curve.push(debts.reduce((t,d)=>t+d.bal,0));
  }
  const when = m => { const x = new Date(start.getFullYear(), start.getMonth()+m, 1); return x.toLocaleDateString("en-US",{month:"short",year:"numeric"}); };
  return {debts, months:month, totalInt, curve, when};
}

function debtChart(a, b){
  const W=520,H=150,L=46,R=10,T=10,B=22; const n = Math.max(a.length,b.length);
  const hi = Math.ceil(Math.max(...a,...b)/10000)*10000||10000;
  const x = i => L+(W-L-R)*i/(n-1||1), y = v => T+(H-T-B)*(1-v/hi);
  let grid=""; for(let v=0; v<=hi; v+=hi/4){ grid+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--rule)"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="IBM Plex Mono, monospace">${Math.round(v/1000)}k</text>`; }
  let ticks=""; const yStep = n>120?24:12; for(let i=yStep;i<n;i+=yStep){ ticks+=`<text x="${x(i)}" y="${H-5}" text-anchor="middle" font-size="10" fill="var(--muted)">${i/12}y</text>`; }
  const line = (arr,col,w,dash) => `<polyline points="${arr.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1)).join(" ")}" fill="none" stroke="${col}" stroke-width="${w}" ${dash?'stroke-dasharray="4 4"':""}/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Total debt over time">${grid}${line(b,"var(--muted)",1.5,true)}${line(a,"var(--accent)",2.2)}${ticks}</svg>`;
}

// ---------- views ----------
function needSetup(){
  return `<section class="sheet empty"><h2>Nothing to project yet</h2><p>Add your checking balance, paycheck and bills in Setup. Everything else builds from those.</p><p><a class="btn" href="#setup" style="text-decoration:none;display:inline-block">Go to Setup</a></p></section>`;
}

function vPlan(){
  if (!S.bills.length && !(+S.pay.amount) && !S.checking) return needSetup();
  const p = project(62);
  const room = (p.low.bal - S.floor);
  const rows = p.rows.map(r=>`<div class="row ${r.kind==="pay"?"pay":""}">
      <span class="d">${short(r.date)}</span>
      <span class="n">${esc(r.name)}</span>
      <span class="a ${r.amt>0?"pos":""}">${r.amt>0?"+":""}${money(r.amt)}<small>${money(r.after,false)}</small></span></div>`).join("");
  return `
  <section class="sheet">
    <div class="hero">
      <div><div class="label">Checking now</div><div class="big num">${money(S.checking)}</div><div class="sub">as of ${short(D(S.asOf))}</div></div>
      <div><div class="label">Low point · 60 days</div><div class="big num ${p.low.bal<S.floor?"neg":""}">${money(p.low.bal,false)}</div><div class="sub">${short(p.low.date)}</div></div>
      <div><div class="label">Next paycheck</div><div class="mid num">${p.nextPay?money(p.nextPay.amt,false):"—"}</div><div class="sub">${p.nextPay?short(p.nextPay.date):"Set pay in Setup"}</div></div>
      <div><div class="label">Room above floor</div><div class="mid num ${room<0?"neg":"pos"}">${money(room,false)}</div><div class="sub">${room<0?"projected to dip below your floor":"safe to send to debt now"}</div></div>
    </div>
    ${lineChart(p.series, S.floor)}
    <div class="sub">Includes everyday spending of about ${money(p.daily*30.4,false)}/mo spread evenly, plus bills not yet checked off. The red dot marks the low point.</div>
  </section>
  <section class="sheet">
    <div class="seg"><h2>Coming up</h2><button class="ghost tiny" data-act="update-bal">Update balance</button></div>
    <div id="balEdit" hidden class="grid2">
      <div class="field"><label class="label" for="qb">Checking</label><input id="qb" class="num" inputmode="decimal" value="${S.checking}"></div>
      <div class="field"><label class="label" for="qd">As of</label><input id="qd" type="date" value="${S.asOf}"></div>
      <button data-act="save-bal" style="grid-column:1/-1">Save balance</button>
    </div>
    <div class="rows">${rows || '<div class="empty">No bills or paychecks in the next 60 days.</div>'}</div>
  </section>`;
}

function vBills(){
  const k = billMonth || mkey(D(S.asOf)); billMonth = k;
  const done = S.paid[k]||[];
  const [y,m] = k.split("-").map(Number);
  const list = [...S.bills].sort((a,b)=>a.day-b.day);
  const total = list.reduce((t,b)=>t+(+b.amount||0),0), paidAmt = list.filter(b=>done.includes(b.id)).reduce((t,b)=>t+(+b.amount||0),0);
  return `<section class="sheet">
    <div class="seg"><button class="ghost tiny" data-act="bm" data-n="-1" aria-label="Previous month">‹</button><h2>${monthName(k)}</h2><button class="ghost tiny" data-act="bm" data-n="1" aria-label="Next month">›</button></div>
    <div class="seg"><span class="sub">${done.length} of ${list.length} paid</span><span class="num">${money(paidAmt,false)} / ${money(total,false)}</span></div>
    <div class="bar"><i style="width:${total?paidAmt/total*100:0}%"></i></div>
    <div class="rows">${list.map(b=>{ const on = done.includes(b.id); const dt = new Date(y,m-1,Math.min(b.day,dim(y,m-1)));
      return `<label class="check ${on?"done":""}"><input type="checkbox" data-act="paid" data-id="${b.id}" ${on?"checked":""}>
      <span class="n">${esc(b.name)}<small style="display:block;color:var(--muted);font-size:.75rem">due ${short(dt)}</small></span>
      <span class="num">${money(b.amount,false)}</span></label>`; }).join("") || '<div class="empty">No bills yet. Add them in Setup.</div>'}</div>
    <div class="sub">Checked bills drop out of the cash flow projection for that month.</div>
  </section>`;
}

function vDebt(){
  if (!S.debts.length) return `<section class="sheet empty"><h2>No debts added</h2><p>Add cards or loans in Setup to see a payoff date and how much an extra payment saves.</p><p><a class="btn" href="#setup" style="text-decoration:none;display:inline-block">Go to Setup</a></p></section>`;
  const r = simulate(S.extra, S.method), base = simulate(0, S.method);
  const total = S.debts.reduce((t,d)=>t+(+d.balance||0),0);
  const monthlyInt = S.debts.reduce((t,d)=>t+(+d.balance||0)*(+d.apr||0)/1200,0);
  const order = [...r.debts].sort((a,b)=>(a.paidOff??999)-(b.paidOff??999));
  const firstTarget = order[0]?.id;
  const meta = Object.fromEntries(S.debts.map(d=>[d.id,d]));
  return `<section class="sheet">
    <div class="hero">
      <div><div class="label">Total debt</div><div class="big num">${money(total,false)}</div><div class="sub">${money(monthlyInt,false)}/mo in interest</div></div>
      <div><div class="label">Debt-free</div><div class="big num pos">${r.months<600?r.when(r.months):"—"}</div><div class="sub">vs ${base.months<600?base.when(base.months):"never"} at plan payments</div></div>
    </div>
    <div class="grid2">
      <div class="field"><label class="label" for="ex">Extra per month</label><input id="ex" class="num" inputmode="decimal" data-act="extra" value="${S.extra}"></div>
      <div class="field"><label class="label" for="me">Order</label><select id="me" data-act="method"><option value="avalanche" ${S.method==="avalanche"?"selected":""}>Highest rate first</option><option value="snowball" ${S.method==="snowball"?"selected":""}>Smallest balance first</option></select></div>
    </div>
    ${debtChart(r.curve, base.curve)}
    <div class="sub"><span style="color:var(--accent)">━</span> with extra · <span>╌</span> plan payments only. Interest saved: <b class="num pos">${money(base.totalInt-r.totalInt,false)}</b> (${money(r.totalInt,false)} total vs ${money(base.totalInt,false)}).</div>
  </section>
  <section class="sheet"><h2>Payoff order</h2>
    <div class="scroll"><table class="tbl"><thead><tr><th>Account</th><th>Balance</th><th>APR</th><th>Paid off</th></tr></thead><tbody>
    ${order.map(d=>`<tr class="${d.id===firstTarget?"focus":""}"><td>${esc(d.name)}${meta[d.id]?.note?`<br><span class="pill brass">${esc(meta[d.id].note)}</span>`:""}</td><td>${money(meta[d.id]?.balance,false)}</td><td>${(+meta[d.id]?.apr||0).toFixed(2)}%</td><td>${d.paidOff?r.when(d.paidOff):"—"}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="sub">Each account keeps its plan payment. The extra goes to the top account; when one is paid off, its payment rolls to the next. Update balances in Setup after each statement.</div>
  </section>`;
}

function vSpend(){
  const k = spendMonth || todayKey(); spendMonth = k;
  const items = S.log.filter(e=>e.date.startsWith(k)).sort((a,b)=>b.date.localeCompare(a.date));
  const by = {}; items.forEach(e=>by[e.cat]=(by[e.cat]||0)+(+e.amount||0));
  const budgetTotal = S.budget.reduce((t,b)=>t+(+b.monthly||0),0), spent = items.reduce((t,e)=>t+(+e.amount||0),0);
  const cats = S.budget.map(b=>b.name);
  const extraCats = Object.keys(by).filter(c=>!cats.includes(c));
  return `<section class="sheet">
    <h2>Log spending</h2>
    <div class="grid3">
      <div class="field"><label class="label" for="sc">Category</label><select id="sc">${cats.concat(cats.includes("Other")?[]:["Other"]).map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>
      <div class="field"><label class="label" for="sa">Amount</label><input id="sa" class="num" inputmode="decimal" placeholder="0.00"></div>
      <div class="field"><label class="label" for="sd">Date</label><input id="sd" type="date" value="${iso(new Date())}"></div>
    </div>
    <div class="field"><label class="label" for="sn">Note</label><input id="sn" placeholder="Optional"></div>
    <button data-act="log">Add to ${monthName(k).split(" ")[0]}</button>
  </section>
  <section class="sheet">
    <div class="seg"><button class="ghost tiny" data-act="sm" data-n="-1" aria-label="Previous month">‹</button><h2>${monthName(k)}</h2><button class="ghost tiny" data-act="sm" data-n="1" aria-label="Next month">›</button></div>
    <div class="seg"><span class="sub">Spent of budget</span><span class="num ${spent>budgetTotal?"neg":""}">${money(spent,false)} / ${money(budgetTotal,false)}</span></div>
    <div>${S.budget.map(b=>{ const s=by[b.name]||0, pct=b.monthly?s/b.monthly*100:0;
      return `<div class="cat"><div class="seg"><span>${esc(b.name)}</span><span class="num sub">${money(s,false)} / ${money(b.monthly,false)}</span></div><div class="bar"><i class="${pct>100?"over":""}" style="width:${Math.min(100,pct)}%"></i></div></div>`; }).join("")}
    ${extraCats.map(c=>`<div class="cat"><div class="seg"><span>${esc(c)}</span><span class="num sub">${money(by[c],false)}</span></div></div>`).join("")}</div>
  </section>
  <section class="sheet"><h2>Entries</h2>
    <div class="rows">${items.map(e=>`<div class="row"><span class="d">${short(D(e.date))}</span><span class="n">${esc(e.cat)}${e.note?`<small>${esc(e.note)}</small>`:""}</span><span class="a">${money(e.amount)} <button class="x" data-act="unlog" data-id="${e.id}" aria-label="Delete entry">×</button></span></div>`).join("") || '<div class="empty">Nothing logged this month yet.</div>'}</div>
  </section>`;
}

function vSetup(){
  const f = (id,lab,val,attrs="") => `<div class="field"><label class="label" for="${id}">${lab}</label><input id="${id}" ${attrs} value="${esc(val)}"></div>`;
  return `<section class="sheet"><h2>Accounts &amp; pay</h2>
    <div class="grid2">
      ${f("s-checking","Checking",S.checking,'class="num" inputmode="decimal" data-k="checking" data-t="n"')}
      ${f("s-asof","Balance as of",S.asOf,'type="date" data-k="asOf"')}
      ${f("s-savings","Savings",S.savings,'class="num" inputmode="decimal" data-k="savings" data-t="n"')}
      ${f("s-floor","Keep at least",S.floor,'class="num" inputmode="decimal" data-k="floor" data-t="n"')}
      ${f("s-pay","Paycheck",S.pay.amount,'class="num" inputmode="decimal" data-k="pay.amount" data-t="n"')}
      ${f("s-next","Next payday",S.pay.next,'type="date" data-k="pay.next"')}
      ${f("s-every","Paid every (days)",S.pay.everyDays,'class="num" inputmode="numeric" data-k="pay.everyDays" data-t="n"')}
    </div>
    <div class="label">One-time income</div>
    ${S.pay.oneOffs.map((o,i)=>`<div class="grid3 editrow"><input aria-label="Label" data-list="pay.oneOffs" data-i="${i}" data-f="label" value="${esc(o.label||"Paycheck")}"><input aria-label="Date" type="date" data-list="pay.oneOffs" data-i="${i}" data-f="date" value="${o.date}"><div class="seg"><input aria-label="Amount" class="num" inputmode="decimal" data-list="pay.oneOffs" data-i="${i}" data-f="amount" data-t="n" value="${o.amount}"><button class="x" data-act="del" data-list="pay.oneOffs" data-i="${i}" aria-label="Remove">×</button></div></div>`).join("")}
    <button class="ghost tiny" data-act="add" data-list="pay.oneOffs">Add one-time income</button>
  </section>
  <section class="sheet"><h2>Bills</h2><div class="label" style="display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px"><span>Name</span><span>Due day</span><span>Amount</span></div>
    ${S.bills.map((b,i)=>`<div class="grid3 editrow"><input aria-label="Bill name" data-list="bills" data-i="${i}" data-f="name" value="${esc(b.name)}"><input aria-label="Due day" class="num" inputmode="numeric" data-list="bills" data-i="${i}" data-f="day" data-t="n" value="${b.day}"><div class="seg"><input aria-label="Amount" class="num" inputmode="decimal" data-list="bills" data-i="${i}" data-f="amount" data-t="n" value="${b.amount}"><button class="x" data-act="del" data-list="bills" data-i="${i}" aria-label="Remove">×</button></div></div>`).join("")}
    <button class="ghost tiny" data-act="add" data-list="bills">Add bill</button>
  </section>
  <section class="sheet"><h2>Monthly spending budget</h2>
    ${S.budget.map((b,i)=>`<div class="editrow" style="grid-template-columns:1.6fr 1fr"><input aria-label="Category" data-list="budget" data-i="${i}" data-f="name" value="${esc(b.name)}"><div class="seg"><input aria-label="Monthly amount" class="num" inputmode="decimal" data-list="budget" data-i="${i}" data-f="monthly" data-t="n" value="${b.monthly}"><button class="x" data-act="del" data-list="budget" data-i="${i}" aria-label="Remove">×</button></div></div>`).join("")}
    <button class="ghost tiny" data-act="add" data-list="budget">Add category</button>
  </section>
  <section class="sheet"><h2>Cards &amp; loans</h2>
    ${S.debts.map((d,i)=>`<div class="editrow">
      <div class="seg"><input aria-label="Name" data-list="debts" data-i="${i}" data-f="name" value="${esc(d.name)}"><button class="x" data-act="del" data-list="debts" data-i="${i}" aria-label="Remove">×</button></div>
      <div class="grid3"><div class="field"><label class="label">Balance</label><input class="num" inputmode="decimal" data-list="debts" data-i="${i}" data-f="balance" data-t="n" value="${d.balance}"></div><div class="field"><label class="label">APR %</label><input class="num" inputmode="decimal" data-list="debts" data-i="${i}" data-f="apr" data-t="n" value="${d.apr}"></div><div class="field"><label class="label">Min payment</label><input class="num" inputmode="decimal" data-list="debts" data-i="${i}" data-f="payment" data-t="n" value="${d.payment}"></div></div>
      <input aria-label="Note" placeholder="Note (promo end date, limit…)" data-list="debts" data-i="${i}" data-f="note" value="${esc(d.note||"")}"></div>`).join("")}
    <button class="ghost tiny" data-act="add" data-list="debts">Add card or loan</button>
  </section>
  <section class="sheet"><h2>Backup &amp; reset</h2>
    <p class="sub">Your numbers are saved in this browser only. Copy a backup to move them to another phone or keep them safe.</p>
    <div class="btnrow"><button class="ghost tiny" data-act="copy">Copy backup</button><button class="ghost tiny" data-act="sample">Load sample data</button><button class="danger tiny ${armed==="reset"?"armed":""}" data-act="reset">${armed==="reset"?"Tap again to erase":"Erase everything"}</button></div>
    <div class="field"><label class="label" for="restore">Restore from backup</label><textarea id="restore" placeholder="Paste a backup here"></textarea></div>
    <div><button class="tiny" data-act="restore">Restore</button></div>
  </section>
  <div class="status">${canStore?"Saved automatically in this browser.":"This browser won't save data, so changes last until you close the page."}</div>`;
}

const RENDER = {plan:vPlan, bills:vBills, debt:vDebt, spend:vSpend, setup:vSetup};
function view(){ const h = location.hash.slice(1); return VIEWS.includes(h)?h:"plan"; }
function render(){
  const v = view();
  document.querySelectorAll("nav.tabs a").forEach(a=>a.classList.toggle("on", a.dataset.v===v));
  if (!S) return;
  $("#asofTag").textContent = "As of " + short(D(S.asOf));
  $("#banner").innerHTML = S.sample ? `<div class="banner"><p><b>Sample data.</b> These are example numbers so you can see how it works. Clear them to enter your own.</p><button class="tiny" data-act="clear-sample">Start with my numbers</button></div>` : "";
  const y = window.scrollY;
  $("#view").innerHTML = RENDER[v]();
  window.scrollTo(0, y);
}

// ---------- persistence (per device) ----------
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.setAttribute("role","status"); t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800); }
function save(){ clearTimeout(saveTimer); saveTimer = setTimeout(flush, 300); }
function flush(){ try { localStorage.setItem(KEY, JSON.stringify(S)); canStore = true; } catch(e){ canStore = false; } }
function load(){ try { const raw = localStorage.getItem(KEY); return raw ? JSON.parse(raw) : null; } catch(e){ canStore = false; return null; } }
function setPath(path, val){ const ks = path.split("."); let o = S; while (ks.length>1) o = o[ks.shift()]; o[ks[0]] = val; }
function getPath(path){ return path.split(".").reduce((o,k)=>o[k], S); }
function edited(){ if (S.sample){ S.sample = false; } save(); render(); }
function arm(name){ armed = name; clearTimeout(armTimer); armTimer = setTimeout(()=>{ armed = null; render(); }, 4000); render(); }

// ---------- events ----------
document.addEventListener("change", e=>{
  const t = e.target; if (!S) return;
  const val = t.dataset.t==="n" ? numIn(t.value) : t.value;
  if (t.dataset.k){ setPath(t.dataset.k, val); edited(); return; }
  if (t.dataset.list){ getPath(t.dataset.list)[+t.dataset.i][t.dataset.f] = val; edited(); return; }
  if (t.dataset.act==="paid"){ const k = billMonth; const arr = new Set(S.paid[k]||[]); t.checked?arr.add(t.dataset.id):arr.delete(t.dataset.id); S.paid[k]=[...arr]; save(); render(); return; }
  if (t.dataset.act==="extra"){ S.extra = numIn(t.value); save(); render(); return; }
  if (t.dataset.act==="method"){ S.method = t.value; save(); render(); return; }
});
document.addEventListener("click", e=>{
  const b = e.target.closest("button[data-act]"); if (!b || !S) return;
  const a = b.dataset.act;
  if (a==="update-bal"){ const el=$("#balEdit"); el.hidden=!el.hidden; if(!el.hidden) $("#qb").focus(); }
  if (a==="save-bal"){ S.checking = numIn($("#qb").value); S.asOf = $("#qd").value||S.asOf; edited(); toast("Balance updated"); }
  if (a==="bm"){ billMonth = shiftMonth(billMonth, +b.dataset.n); render(); }
  if (a==="sm"){ spendMonth = shiftMonth(spendMonth, +b.dataset.n); render(); }
  if (a==="log"){ const amt = numIn($("#sa").value); if(!(amt>0)){ $("#sa").focus(); toast("Enter an amount"); return; }
    const date = $("#sd").value||iso(new Date()); S.log.push({id:uid(), date, cat:$("#sc").value, amount:Math.round(amt*100)/100, note:$("#sn").value.trim()}); spendMonth = date.slice(0,7); save(); render(); toast("Logged "+money(amt)); }
  if (a==="unlog"){ S.log = S.log.filter(x=>x.id!==b.dataset.id); save(); render(); }
  if (a==="del"){ getPath(b.dataset.list).splice(+b.dataset.i,1); edited(); }
  if (a==="add"){ const L=b.dataset.list, list=getPath(L);
    if (L==="bills") list.push({id:uid(),name:"New bill",day:1,amount:0});
    if (L==="budget") list.push({id:uid(),name:"New category",monthly:0});
    if (L==="debts") list.push({id:uid(),name:"New card",balance:0,apr:0,payment:0,note:""});
    if (L==="pay.oneOffs") list.push({label:"Bonus",date:iso(new Date()),amount:0});
    edited(); }
  if (a==="clear-sample"){ S = normalize({}); billMonth = spendMonth = null; save(); location.hash = "setup"; render(); toast("Cleared. Enter your numbers below."); }
  if (a==="sample"){ S = sampleState(); billMonth = spendMonth = null; save(); location.hash = "plan"; render(); toast("Sample data loaded"); }
  if (a==="reset"){ if (armed!=="reset"){ arm("reset"); return; } armed = null; S = normalize({}); billMonth = spendMonth = null; save(); render(); toast("Everything erased"); }
  if (a==="copy"){ const txt = JSON.stringify(S);
    const fallback = () => { const ta = $("#restore"); ta.value = txt; ta.select(); toast("Backup selected. Copy it from the box."); };
    try { navigator.clipboard.writeText(txt).then(()=>toast("Backup copied"), fallback); } catch(err){ fallback(); } }
  if (a==="restore"){ const raw = $("#restore").value.trim(); if (!raw){ $("#restore").focus(); toast("Paste a backup first"); return; }
    try { const d = JSON.parse(raw); if (typeof d!=="object" || !d || !Array.isArray(d.bills)) throw 0; S = normalize(d); billMonth = spendMonth = null; save(); render(); toast("Backup restored"); }
    catch(err){ toast("That isn't a Runway backup. Copy the whole backup and try again."); } }
});
window.addEventListener("hashchange", render);

// ---------- boot ----------
const saved = load();
S = saved ? normalize(saved) : sampleState();
if (!canStore) $("#status").textContent = "This browser won't save data, so changes last until you close the page.";
render();
})();
</script>

</body>
</html>
